# ============================================================
# Nav2 完整配置文件 - TurtleBot3 仿真
# ============================================================

# ============================================================
# 1. AMCL 定位模块
# ============================================================
amcl:
  ros__parameters:
    use_sim_time: True                    # 使用仿真时间
    alpha1: 0.2                           # 运动模型噪声参数1(旋转->旋转)
    alpha2: 0.2                           # 运动模型噪声参数2(旋转->平移)
    alpha3: 0.2                           # 运动模型噪声参数3(平移->旋转)
    alpha4: 0.2                           # 运动模型噪声参数4(平移->平移)
    alpha5: 0.2                           # 运动模型噪声参数5(额外)
    base_frame_id: "base_footprint"       # 机器人基座标系
    beam_skip_distance: 0.5               # 光束跳过距离阈值
    beam_skip_error_threshold: 0.9        # 光束跳过误差阈值
    beam_skip_threshold: 0.3              # 光束跳过阈值
    do_beamskip: false                    # 是否启用光束跳过
    global_frame_id: "map"                # 全局坐标系
    lambda_short: 0.1                     # 短距离测量权重
    laser_likelihood_max_dist: 2.0        # 激光似然最大距离
    laser_max_range: 100.0                # 激光最大测距(m)
    laser_min_range: -1.0                 # 激光最小测距(-1禁用)
    laser_model_type: "likelihood_field"  # 激光观测模型类型
    max_beams: 60                         # 每次更新使用的最大光束数
    max_particles: 2000                   # 最大粒子数
    min_particles: 500                    # 最小粒子数
    odom_frame_id: "odom"                 # 里程计坐标系
    pf_err: 0.05                          # 粒子滤波误差阈值
    pf_z: 0.99                            # 粒子滤波上分位数
    recovery_alpha_fast: 0.0              # 快速恢复衰减率(0禁用)
    recovery_alpha_slow: 0.0              # 慢速恢复衰减率(0禁用)
    resample_interval: 1                  # 重采样间隔(每1次更新)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 差速机器人模型
    save_pose_rate: 0.5                   # 保存位姿频率(Hz)
    sigma_hit: 0.2                        # 激光命中测量标准差
    tf_broadcast: true                    # 是否广播TF变换
    transform_tolerance: 1.0              # TF变换容差(s)
    update_min_a: 0.2                     # 最小旋转更新(rad)
    update_min_d: 0.25                    # 最小位移更新(m)
    z_hit: 0.5                            # 命中测量权重
    z_max: 0.05                           # 最大距离测量权重
    z_rand: 0.5                           # 随机测量权重
    z_short: 0.05                         # 短距离测量权重
    scan_topic: scan                      # 激光扫描话题

# ============================================================
# 2. 行为树导航器
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map                     # 全局坐标系
    robot_base_frame: base_link           # 机器人基座标
    odom_topic: /odom                     # 里程计话题
    bt_loop_duration: 10                  # 行为树循环周期(ms)
    default_server_timeout: 20            # 默认服务超时(s)
    wait_for_service_timeout: 1000        # 等待服务超时(ms)
    plugin_lib_names:                     # 行为树插件列表
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

# ============================================================
# 3. 控制器服务器(局部路径规划)
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0            # 控制器运行频率(Hz)
    min_x_velocity_threshold: 0.001       # X方向最小速度阈值
    min_y_velocity_threshold: 0.5         # Y方向最小速度阈值
    min_theta_velocity_threshold: 0.001   # 角速度最小阈值
    failure_tolerance: 0.3                # 失败容差
    progress_checker_plugin: "progress_checker"   # 进度检查插件
    goal_checker_plugins: ["general_goal_checker"] # 目标检查插件
    controller_plugins: ["FollowPath"]    # 控制器插件

    # 进度检查器
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5       # 所需移动半径
      movement_time_allowance: 10.0       # 移动允许时间(s)

    # 通用目标检查器
    general_goal_checker:
      stateful: True                      # 有状态检查
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25             # XY位置容差(m)
      yaw_goal_tolerance: 0.25            # 偏航角容差(rad)

    # DWB局部规划器
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True      # 调试轨迹详情
      min_vel_x: 0.0                      # 最小X速度(m/s)
      min_vel_y: 0.0                      # 最小Y速度(m/s)
      max_vel_x: 0.26                     # 最大X速度(m/s)
      max_vel_y: 0.0                      # 最大Y速度(m/s)
      max_vel_theta: 1.0                  # 最大角速度(rad/s)
      min_speed_xy: 0.0                   # 最小XY速度
      max_speed_xy: 0.26                  # 最大XY速度
      min_speed_theta: 0.0                # 最小角速度
      acc_lim_x: 2.5                      # X加速度限制(m/s²)
      acc_lim_y: 0.0                      # Y加速度限制
      acc_lim_theta: 3.2                  # 角加速度限制(rad/s²)
      decel_lim_x: -2.5                   # X减速度限制
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20                      # X速度采样数
      vy_samples: 5                       # Y速度采样数
      vtheta_samples: 20                  # 角速度采样数
      sim_time: 1.7                       # 模拟时间(s)
      linear_granularity: 0.05            # 线性插值粒度
      angular_granularity: 0.025          # 角度插值粒度
      transform_tolerance: 0.2            # TF容差(s)
      xy_goal_tolerance: 0.25             # XY目标容差
      trans_stopped_velocity: 0.25        # 停止平移速度阈值
      short_circuit_trajectory_evaluation: True  # 短路轨迹评估
      stateful: True                      # 有状态
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02            # 基础障碍物代价权重
      PathAlign.scale: 32.0               # 路径对齐代价权重
      PathAlign.forward_point_distance: 0.1  # 前向点距离
      GoalAlign.scale: 24.0               # 目标对齐代价权重
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0                # 路径距离代价权重
      GoalDist.scale: 24.0                # 目标距离代价权重
      RotateToGoal.scale: 32.0            # 旋转到目标代价权重
      RotateToGoal.slowing_factor: 5.0    # 减速因子
      RotateToGoal.lookahead_time: -1.0   # 前瞻时间(-1禁用)

# ============================================================
# 4. 局部代价地图
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0               # 更新频率(Hz)
      publish_frequency: 2.0              # 发布频率(Hz)
      global_frame: odom                  # 全局坐标系
      robot_base_frame: base_link         # 机器人基座标
      use_sim_time: True
      rolling_window: true                # 滚动窗口
      width: 3.0                          # 地图宽度(m)
      height: 3.0                         # 地图高度(m)
      resolution: 0.05                    # 地图分辨率(m/像素)
      robot_radius: 0.12                  # 机器人半径(m)
      plugins: ["voxel_layer", "inflation_layer"]  # 插件层
      always_send_full_costmap: True      # 始终发送完整代价地图

      # 膨胀层
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0          # 代价缩放因子
        inflation_radius: 0.55            # 膨胀半径(m)

      # 体素层(3D障碍物)
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True           # 发布体素地图
        origin_z: 0.0                     # Z轴原点
        z_resolution: 0.05                # Z轴分辨率
        z_voxels: 16                      # Z轴体素数
        max_obstacle_height: 2.0          # 最大障碍物高度(m)
        mark_threshold: 0                 # 标记阈值
        observation_sources: scan         # 观测来源
        scan:
          topic: /scan                    # 激光扫描话题
          max_obstacle_height: 2.0
          clearing: True                  # 清除障碍物
          marking: True                   # 标记障碍物
          data_type: "LaserScan"          # 数据类型
          raytrace_max_range: 3.0         # 光线追踪最大范围
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5         # 障碍物最大范围
          obstacle_min_range: 0.0

      # 静态层(地图)
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

# ============================================================
# 5. 全局代价地图
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0               # 更新频率(Hz)
      publish_frequency: 1.0              # 发布频率(Hz)
      global_frame: map                   # 全局坐标系
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true           # 跟踪未知空间
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      always_send_full_costmap: True

      # 障碍物层
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # 静态层
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      # 膨胀层
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ============================================================
# 6. 地图服务器
# ============================================================
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""                     # 地图文件路径(由launch文件指定)

# ============================================================
# 7. 地图保存器
# ============================================================
map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0                 # 保存超时(s)
    free_thresh_default: 0.25             # 自由空间阈值
    occupied_thresh_default: 0.65         # 占用阈值
    map_subscribe_transient_local: True

# ============================================================
# 8. 路径规划服务器
# ============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0      # 预期规划频率
    use_sim_time: True
    planner_plugins: ["GridBased"]        # 规划器插件
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5                      # 规划容差
      use_astar: false                    # 使用A*算法(False使用Dijkstra)
      allow_unknown: true                 # 允许通过未知空间

# ============================================================
# 9. 路径平滑服务器
# ============================================================
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"] # 平滑器插件
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10                  # 收敛容差
      max_its: 1000                       # 最大迭代次数
      do_refinement: True                 # 是否细化

# ============================================================
# 10. 行为服务器(恢复行为)
# ============================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw    # 代价地图话题
    footprint_topic: local_costmap/published_footprint  # 足迹话题
    cycle_frequency: 10.0                       # 运行频率
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:                                       # 原地旋转
      plugin: "nav2_behaviors/Spin"
    backup:                                     # 后退
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:                           # 沿航向行驶
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:                                       # 等待
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:                            # 辅助遥操作
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom                          # 全局坐标系
    robot_base_frame: base_link                 # 机器人基座标
    transform_tolerance: 0.1                    # TF容差
    use_sim_time: true
    simulate_ahead_time: 2.0                    # 前向模拟时间
    max_rotational_vel: 1.0                     # 最大旋转速度
    min_rotational_vel: 0.4                     # 最小旋转速度
    rotational_acc_lim: 3.2                     # 旋转加速度限制

# ============================================================
# 11. 机器人状态发布器
# ============================================================
robot_state_publisher:
  ros__parameters:
    use_sim_time: True

# ============================================================
# 12. 航点跟随器
# ============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20                             # 循环频率(Hz)
    stop_on_failure: false                    # 失败时停止
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 航点任务插件
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200            # 航点暂停时间(s)

# ============================================================
# 13. 速度平滑器
# ============================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0                 # 平滑频率(Hz)
    scale_velocities: False                   # 是否缩放速度
    feedback: "OPEN_LOOP"                     # 反馈模式(开环)
    max_velocity: [0.26, 0.0, 1.0]            # 最大速度 [x, y, theta]
    min_velocity: [-0.26, 0.0, -1.0]          # 最小速度 [x, y, theta]
    max_accel: [2.5, 0.0, 3.2]                # 最大加速度 [x, y, theta]
    max_decel: [-2.5, 0.0, -3.2]              # 最大减速度 [x, y, theta]
    odom_topic: "odom"                        # 里程计话题
    odom_duration: 0.1                        # 里程计数据时长(s)
    deadband_velocity: [0.0, 0.0, 0.0]        # 死区速度
    velocity_timeout: 1.0                     # 速度超时(s)

# ============================================================
# 总结 - TurtleBot3 仿真参数
# ============================================================
# 机器人参数:
#   - 最大线速度: 0.26 m/s
#   - 最大角速度: 1.0 rad/s
#   - 机器人半径: 0.22 m
#   - 膨胀半径: 0.55 m
#
# 地图参数:
#   - 分辨率: 0.05 m/像素
#   - 局部地图: 3x3m 滚动窗口
#   - 全局地图: 跟踪未知空间
#
# 定位参数(AMCL):
#   - 粒子数: 500-2000
#   - 更新阈值: 0.2rad 或 0.25m
#
# 规划参数:
#   - 规划器: Navfn (Dijkstra)
#   - 控制器: DWB
#   - 平滑器: 简单平滑器
# ============================================================