image: room.pgm               # 地图图片文件名（黑白灰度图）
mode: trinary                 # 地图模式：三值（占用/空闲/未知）
resolution: 0.05              # 分辨率：每个像素代表 0.05 米（5cm）
origin: [-14.7, -9.53, 0]     # 地图原点坐标 [x, y, 偏航角]（地图左下角在真实世界的位置）
negate: 0                     # 是否反转黑白（0=白空闲/黑占用，1=反）
occupied_thresh: 0.65         # 占用阈值：像素灰度 > 0.65 视为障碍物
free_thresh: 0.25             # 空闲阈值：像素灰度 < 0.25 视为可通行